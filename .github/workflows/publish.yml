name: Publish to npm

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      prerelease:
        required: true
        type: boolean
      ref:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.ref != '' || github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: test "$(node -p "require('./package.json').version")" = "${EXPECTED_VERSION#v}"

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run test:package
      - name: Publish package
        env:
          PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease }}
        shell: bash
        run: |
          args=(--access public)
          if [ "$PRERELEASE" = true ]; then
            args+=(--tag next)
          fi
          npm publish "${args[@]}"
